# Netlify : compile l'application Next.js (pages + route /api/submit)
# au lieu de publier les fichiers bruts du dépôt.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Module Next.js de Netlify déclaré explicitement : sans lui, un build lancé
# depuis GitHub publie le dossier .next en fichiers bruts (site en 404).
[[plugins]]
  package = "@netlify/plugin-nextjs"
